name: FlashGuard CI

on:
  push:
    branches:
      - qa-integration
      - main

  pull_request:
    branches:
      - qa-integration
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Project Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit
